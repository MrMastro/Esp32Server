; Waveshare ESP32-C6-LCD-1.3 (ST7789V2 240x240, WS2812B RGB LED)
; L'ESP32-C6 richiede Arduino core 3.x: la piattaforma ufficiale "espressif32"
; si ferma al core 2.x, quindi si usa il fork pioarduino.

[platformio]
; "pio run" senza -e compila solo l'ambiente USB
default_envs = esp32-c6-lcd-1_3
; IP e password OTA personali (file non versionato, vedi ota_local.ini.example)
extra_configs = ota_local.ini

; Valori OTA di default, sovrascritti da ota_local.ini se presente
[ota]
ip = 192.168.4.1
password = esp32password

[env:esp32-c6-lcd-1_3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; la scheda ha 4MB di flash (il devkitc-1 di default ne prevede 8MB)
board_upload.flash_size = 4MB
; 2 slot app da 1.9MB (per l'OTA) e SPIFFS minimo: le configurazioni stanno sulla microSD
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
; come il progetto principale: i caratteri digitati partono subito, uno alla volta,
; e il comando viene eseguito dopo 1s senza nuovi caratteri (non serve Invio)
monitor_raw = yes
; sulla USB del C6 DTR/RTS fanno da pulsanti RESET/BOOT: tenerli bassi evita che la scheda
; si riavvii ogni volta che si apre o chiude il monitor
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600

build_flags =
    ; USB nativa: Serial va sulla porta USB-C
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; attesa all'avvio (ms) per dare tempo al monitor seriale di ricollegarsi
    ; prima del log iniziale; 0 per disattivarla
    -DBOOT_SERIAL_WAIT_MS=3000

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    bblanchon/ArduinoJson@^7.0.0

; Upload via WiFi (richiede ota_upload = true in main_settings.json)
[env:esp32-c6-lcd-1_3-ota]
extends = env:esp32-c6-lcd-1_3
upload_protocol = espota
upload_port = ${ota.ip}
upload_flags =
    --port=3232
    --auth=${ota.password}
