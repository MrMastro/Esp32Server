; Waveshare ESP32-C6-LCD-1.3 (ST7789V2 240x240, WS2812B RGB LED)
; L'ESP32-C6 richiede Arduino core 3.x: la piattaforma ufficiale "espressif32"
; si ferma al core 2.x, quindi si usa il fork pioarduino.

[env:esp32-c6-lcd-1_3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino

; la scheda ha 4MB di flash (il devkitc-1 di default ne prevede 8MB)
board_upload.flash_size = 4MB
; 2 slot app da 1.9MB (per l'OTA) e SPIFFS minimo: le configurazioni stanno sulla microSD
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    ; USB nativa: Serial va sulla porta USB-C
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    bblanchon/ArduinoJson@^7.0.0
