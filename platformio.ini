; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Ambiente principale: SENZA Bluetooth, con OTA.
; min_spiffs.csv = 2 slot app da 1.9MB (necessari per l'OTA) + LittleFS 128KB.
; ATTENZIONE: passando da/a Esp32ComBT cambia la tabella partizioni e LittleFS si sposta:
; dopo l'upload del firmware rifare anche "-t uploadfs" (settings.json e preset).
[env:Esp32Com]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	makuna/NeoPixelBus
	esphome/ESPAsyncWebServer-esphome
	robtillaart/ANSI
	bblanchon/ArduinoJson
; NeoPixelBus include "i2s.h" solo per ESP8266, ma il Library Dependency Finder non valuta gli #ifdef
; e su Windows lo associa alla libreria I2S del framework: compilata inutilmente, con warning deprecated
lib_ignore = I2S
monitor_raw = yes
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
upload_speed = 921600
; EXCLUDE_BLUETOOTH: Bluetooth escluso dal firmware (~730KB in meno, cosi' entra nello slot OTA).
; Con communicationMode BLUETOOTH_MODE il dispositivo parte in AP_MODE con un warning
build_flags =
	-DEXCLUDE_BLUETOOTH

; Variante CON Bluetooth (BLUETOOTH_MODE): il firmware (~2MB) non entra in due slot OTA,
; quindi huge_app.csv (un solo slot da 3MB), solo upload USB e OTA disattivato nel firmware.
[env:Esp32ComBT]
extends = env:Esp32Com
board_build.partitions = huge_app.csv
build_flags =

; Upload via WiFi (OTA) dello stesso firmware di Esp32Com (senza Bluetooth, min_spiffs.csv).
; Richiede "ota_upload": true in settings.json. IP e password in ota_local.ini
; (non versionato, vedi ota_local.ini.example)
[env:Esp32Server]
extends = env:Esp32Com
upload_protocol = espota
upload_port = ${ota.ip}
upload_flags = 
	--port=3232
	--auth=${ota.password}

[ota]
ip = 192.168.4.1
password = esp32password

[platformio]
default_envs = Esp32Com
extra_configs = ota_local.ini
