; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:Esp32Com]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	makuna/NeoPixelBus
	esphome/ESPAsyncWebServer-esphome
	robtillaart/ANSI
	bblanchon/ArduinoJson
monitor_raw = yes
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
; CH340 a 921600 baud: upload ~4x piu' veloce del default (115200). Se da errori usare 460800
upload_speed = 921600

[env:Esp32ComP1]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	makuna/NeoPixelBus
	esphome/ESPAsyncWebServer-esphome
	robtillaart/ANSI
	bblanchon/ArduinoJson
monitor_raw = yes
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv

[env:TestEsp32ComOTA]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
platform_packages = platformio/framework-arduinoespressif32
framework = arduino
test_framework = unity
lib_deps = 
	makuna/NeoPixelBus
	esphome/ESPAsyncWebServer-esphome
	robtillaart/ANSI
	bblanchon/ArduinoJson
monitor_raw = yes
board_build.filesystem = littlefs
upload_protocol = espota
upload_flags = 
	--port=3232
	--auth=Password

[env:native]
platform = native
build_flags = -DUNIT_TEST
lib_deps = 
	makuna/NeoPixelBus@^2.8.2
	ayushsharma82/WebSerial@^2.0.7
	mathieucarbou/ESPAsyncWebServer@^3.3.1
	robtillaart/ANSI@^0.3.2
	bblanchon/ArduinoJson@^7.2.1

[env:Esp32Server]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
framework = arduino
lib_deps = 
	makuna/NeoPixelBus@^2.8.2
	esphome/ESPAsyncWebServer-esphome
	robtillaart/ANSI@^0.3.2
	bblanchon/ArduinoJson@^7.2.1
monitor_raw = yes
; Serial.begin(115200) in setup(): con 9600 il monitor mostrava caratteri illeggibili
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = huge_app.csv
; Upload via WiFi: IP e password in ota_local.ini (non versionato, vedi ota_local.ini.example)
upload_protocol = espota
upload_port = ${ota.ip}
upload_flags = 
	--port=3232
	--auth=${ota.password}

; Valori OTA di default, sovrascritti da ota_local.ini se presente
[ota]
ip = 192.168.4.1
password = esp32password

[platformio]
description = local server for esp32
; IP e password OTA personali (file non versionato, vedi ota_local.ini.example)
extra_configs = ota_local.ini
; "pio run" senza -e compila solo l'ambiente USB (non tutti e 5)
default_envs = Esp32Com
